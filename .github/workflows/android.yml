name: Build Android APK (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Initialize Project & Build Code
      run: |
        # 1. Инициализируем Node-проект и ставим Capacitor CLI
        npm init -y
        npm install @capacitor/core @capacitor/cli
        
        # 2. Создаем обязательную веб-папку и переносим ваш index.html
        mkdir -p www
        cp -f index.html ./www/index.html
        
        # 3. Инициализируем конфигурацию Capacitor
        npx cap init CheklistITS com.checklist.its --web-dir=www
        cp -f capacitor.config.json ./capacitor.config.json || true
        
        # 4. Устанавливаем мобильную платформу Android и плагин нативной Камеры
        npm install @capacitor/android @capacitor/camera
        npx cap add android
        
        # 5. Синхронизируем веб-код внутрь папки Android
        npx cap sync android

    - name: Force Fix SDK Versions & Gradle Configurations
      run: |
        # Поднимаем minSdkVersion до 24 во всех конфигурационных файлах
        find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' {} \;
        find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' {} \;
        find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' {} \;
        
        if [ -f android/variables.gradle ]; then
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' android/variables.gradle
        fi

        # Безопасно поднимаем версию Android Gradle Plugin до 8.9.1, чтобы удовлетворить требования androidx.core
        sed -i 's/com.android.tools.build:gradle:8.7.2/com.android.tools.build:gradle:8.9.1/g' android/build.gradle

        # Исправление конфликта Kotlin (Duplicate Classes) через ResolutionStrategy
        sed -i '/allprojects {/a \    configurations.all {\n        resolutionStrategy.eachDependency { DependencyResolveDetails details ->\n            if (details.requested.group == "org.jetbrains.kotlin") {\n                details.useVersion "1.9.22"\n            }\n        }\n    }' android/build.gradle
        
        echo "android.useAndroidX=true" >> android/gradle.properties
        echo "Все исправления версий и плагина Gradle успешно применены."

    - name: Build APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m"

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: checklist-capacitor-apk
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          **/*.apk
        if-no-files-found: error
