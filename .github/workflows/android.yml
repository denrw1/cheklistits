name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova & Android Tools
      run: |
        npm install -g cordova
        sudo apt-get update
        sudo apt-get install -y android-sdk

    - name: Create Mobile Wrapper
      run: |
        # 1. Создаем проект Cordova
        cordova create myapp com.checklist.its CheklistITS
        cd myapp
        cordova platform add android --no-telemetry
        
        # 2. Устанавливаем плагин для работы с файловой системой
        cordova plugin add cordova-plugin-file --no-telemetry
        
        # 3. Вычищаем дефолтный шаблон
        rm -rf www/*
        
        # 4. Копируем ВАШ index.html и ВАШ config.xml из корня репозитория
        cp -f ../index.html ./www/index.html
        cp -f ../config.xml ./config.xml
        
        # 5. Запускаем компиляцию
        cordova build android --device --no-telemetry

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: checklist-apk
        path: |
          myapp/platforms/android/app/build/outputs/apk/**/*.apk
          **/*.apk
        if-no-files-found: error
