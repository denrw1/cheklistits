name: Build Android APK (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: |
        sdkmanager --licenses || true

    - name: Initialize Project & Build Code
      run: |
        # 1. Инициализируем Node-проект и ставим Capacitor CLI
        npm init -y
        npm install @capacitor/core @capacitor/cli
        
        # 2. Создаем обязательную веб-папку и переносим ваш index.html
        mkdir -p www
        cp -f index.html ./www/index.html
        
        # 3. Инициализируем конфигурацию Capacitor
        npx cap init CheklistITS com.checklist.its --web-dir=www
        
        # Принудительно заменяем дефолтный конфиг на ваш кастомный из репозитория
        cp -f capacitor.config.json ./capacitor.config.json || true
        
        # 4. Устанавливаем мобильную платформу Android
        npm install @capacitor/android
        npx cap add android
        
        # 5. Синхронизируем веб-код внутрь папки Android
        npx cap sync android

    - name: Build APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: checklist-capacitor-apk
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          **/*.apk
        if-no-files-found: error
