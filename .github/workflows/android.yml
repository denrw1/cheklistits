name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Generate Android Project from PWA
      run: |
        # Автоматическая инициализация Bubblewrap под вашу рабочую ссылку
        bubblewrap init --manifest="https://bolt.host" --meta=meta.json --confirm
        bubblewrap build --confirm

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: asu-inspector-apk
        path: ./*.apk
