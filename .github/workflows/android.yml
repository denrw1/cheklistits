name: Build Android APK (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Initialize Project & Build Code
      run: |
        # 1. Инициализируем Node-проект и ставим Capacitor CLI
        npm init -y
        npm install @capacitor/core @capacitor/cli
        
        # 2. Создаем обязательную веб-папку и переносим ваш index.html
        mkdir -p www
        cp -f index.html ./www/index.html
        
        # 3. Инициализируем конфигурацию Capacitor
        npx cap init CheklistITS com.checklist.its --web-dir=www
        cp -f capacitor.config.json ./capacitor.config.json || true
        
        # 4. Устанавливаем мобильную платформу Android и плагин нативной Камеры
        npm install @capacitor/android @capacitor/camera
        npx cap add android

        # [ОБНОВЛЕНО] Генерируем иконку: берем ваш логотип без фона, а подложку оставляем стандартной белой
npm install @capacitor/assets --save-dev
npx capacitor-assets generate --android --icon-foreground-source=resources/icon-foreground.png --icon-background-color=#ffffff

# 5. Синхронизируем веб-код внутрь папки Android
npx cap sync android

    - name: Inject Native Android Camera Permissions
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        
        # Принудительно прописываем системные разрешения Android перед закрывающим тегом </manifest>
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />' $MANIFEST_PATH
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.FLASHLIGHT" />' $MANIFEST_PATH
        sed -i '/<\/manifest>/i \    <uses-feature android:name="android.hardware.camera" android:required="true" />' $MANIFEST_PATH
        
        echo "Системные разрешения камеры успешно внедрены в AndroidManifest.xml"

    - name: Force Fix SDK Versions & Gradle Configurations
      run: |
        # Поднимаем minSdkVersion до 24 во всех конфигурационных файлах
        find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' {} \;
        find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' {} \;
        find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' {} \;
        
        # Принудительно поднимаем compileSdkVersion и targetSdkVersion до 36, чтобы удовлетворить androidx.core:core:1.17.0
        find android/ -name "build.gradle" -exec sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' {} \;
        find android/ -name "build.gradle" -exec sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' {} \;
        find android/ -name "build.gradle" -exec sed -i 's/compileSdk = 35/compileSdk = 36/g' {} \;
        find android/ -name "build.gradle" -exec sed -i 's/targetSdk = 35/targetSdk = 36/g' {} \;

        if [ -f android/variables.gradle ]; then
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle
        fi

        # Поднимаем версию Android Gradle Plugin до актуальной 8.9.1
        sed -i 's/com.android.tools.build:gradle:8.7.2/com.android.tools.build:gradle:8.9.1/g' android/build.gradle

        # Жестко фиксируем версию Kotlin на требуемой компилятором отметке 2.2.20
        sed -i '/allprojects {/a \    configurations.all {\n        resolutionStrategy.eachDependency { DependencyResolveDetails details ->\n            if (details.requested.group == "org.jetbrains.kotlin") {\n                details.useVersion "2.2.20"\n            }\n        }\n    }' android/build.gradle
        
        echo "android.useAndroidX=true" >> android/gradle.properties

    - name: Build APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m"

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: checklist-capacitor-apk
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          **/*.apk
