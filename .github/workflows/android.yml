name: Build Android APK (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize Project & Build Code
      run: |
        # 1. Создаем структуру и устанавливаем Capacitor
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # 2. Создаем папку для веб-кода и копируем ваш index.html
        mkdir www
        cp -f index.html ./www/index.html
        
        # 3. Инициализируем Capacitor и добавляем платформу Android
        npx cap init CheklistITS com.checklist.its --web-dir=www
        # Копируем созданный вами ранее жесткий конфиг, если нужно
        cp -f capacitor.config.json ./capacitor.config.json || true
        
        npx cap add android

    - name: Build APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: checklist-capacitor-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
