<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>АСУ Инспектор</title>
    <!-- 1. РАСШИРЕННЫЙ ДОСТУП: Разрешаем протоколы capacitor:// во избежание CORS блокировок -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: gap: capacitor://*; style-src * 'unsafe-inline'; img-src * data: blob: capacitor://*; media-src * blob: mediastream:;">
    <style>
        :root {
            --color-primary: #0066cc; --color-success: #2e7d32; --color-success-bg: #e8f5e9;
            --color-danger: #d32f2f; --color-gray: #666666; --color-bg: #f4f6f9;
            --color-card: #ffffff; --color-text: #1a1a1a; --radius: 12px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background-color: var(--color-bg); color: var(--color-text); padding: 16px; }
        h2 { font-size: 1.3rem; margin-bottom: 16px; font-weight: 700; color: #2c3e50; text-align: center; }
        button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; padding: 14px; margin: 12px 0; font-size: 16px; font-weight: 600; background-color: var(--color-primary); color: white; border: none; border-radius: var(--radius); cursor: pointer; }
        button:active { opacity: 0.75; transform: scale(0.98); }
        button.secondary { background-color: var(--color-gray); }
        .screen { display: none; }
        .screen.active { display: block; }
        /* Панель для вывода реальных ошибок прямо на экран смартфона */
        #debug-console { background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; margin-top: 20px; border-radius: 8px; max-height: 150px; overflow-y: auto; border: 2px solid var(--color-danger); }
    </style>
</head>
<body>

    <!-- ОКНО ОТЛАДКИ (Если JS упадет, мы увидим причину прямо на телефоне) -->
    <div id="debug-console">Консоль отладки: Ошибок пока нет. Если кнопки не работают, тут появится текст ошибки...</div>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="scr-main" class="screen active">
        <h2 style="margin-top:20px;">Контроль агрегатов АСУ</h2>
        <button id="btn-open-create">Создать новый АСУ</button>
        <button id="btn-open-select" class="secondary">Выбрать имеющийся АСУ</button>
    </div>

    <!-- ЭКРАН 2: ПРОСТЕЙШИЙ ТЕСТОВЫЙ ЭКРАН СЛЕДУЮЩЕГО ШАГА -->
    <div id="scr-select-asu" class="screen">
        <h2>Экран выбора АСУ</h2>
        <p style="text-align:center;">Если вы видите этот текст, значит JavaScript внутри Android успешно ожил!</p>
        <button id="btn-back-from-select" class="secondary">⬅ Назад в меню</button>
    </div>

    <script>
        // Ловим любые падения движка и выводим на экран смартфона
        window.onerror = function(msg, url, line) {
            const con = document.getElementById('debug-console');
            if(con) con.innerText = "КРИТИЧЕСКАЯ ОШИБКА: " + msg + " (Линия: " + line + ")";
            return false;
        };

        // Максимально простая, топорная привязка без усложненной логики плагинов
        document.addEventListener("DOMContentLoaded", () => {
            const logBox = document.getElementById('debug-console');
            logBox.innerText += "\n[DOM Загружен. Привязываем клики...]";

            const btnCreate = document.getElementById("btn-open-create");
            const btnSelect = document.getElementById("btn-open-select");
            const btnBack = document.getElementById("btn-back-from-select");

            if (btnCreate && btnSelect && btnBack) {
                logBox.innerText += "\n[Элементы кнопок найдены успешно]";
                
                btnCreate.onclick = function() {
                    logBox.innerText += "\n[Клик по кнопке Создать]";
                    alert("Кнопка работает! Переключаем экран...");
                    document.getElementById("scr-main").classList.remove("active");
                    document.getElementById("scr-select-asu").classList.add("active");
                };

                btnSelect.onclick = function() {
                    logBox.innerText += "\n[Клик по кнопке Выбрать]";
                    document.getElementById("scr-main").classList.remove("active");
                    document.getElementById("scr-select-asu").classList.add("active");
                };

                btnBack.onclick = function() {
                    document.getElementById("scr-select-asu").classList.remove("active");
                    document.getElementById("scr-main").classList.add("active");
                };
            } else {
                logBox.innerText += "\n[ОШИБКА: Кнопки не найдены в DOM-дереве]";
            }
        });
    </script>
</body>
</html>
